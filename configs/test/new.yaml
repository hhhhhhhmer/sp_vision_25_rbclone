camera_name: "daheng"
camera_sn: "FDN24040486"
exposure_us: 4000
gain: 0.5
gamma: 0.5
vid_pid: "2ba2:4d55"
flip: true
mirror: true
timestamp_offset_us: 1000 #us

# -1  0  0
#  0 -1  0
#  0  0  1
# R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.1038px
camera_matrix: [3573.8871211853852, 0, 759.6110274527607, 0, 3575.5260079875206, 540.5228454474532, 0, 0, 1]
distort_coeffs: [-0.0036141604884034327, -0.07167222928321375, 0.0023535327998900255, 0.0016481114051130523, 3.0853866279427096]

# 相机同理想情况的偏角: yaw-0.27 pitch-1.77 roll13.35 degree
# 标定板到世界坐标系原点的水平距离: 2.95 m
# 标定板同竖直摆放时的偏角: yaw-7.15 pitch1.14 roll-166.87 degree
R_camera2gimbal: [-0.0026354852661435997, -0.03118658414165278, 0.9995101055952299, -0.972997057789298, 0.23077097552743725, 0.0046349096522381944, -0.2308024691176014, -0.9725081767387306, -0.030952648118182692]
t_camera2gimbal: [0.1371328468033064, -0.01029805801526449, -0.01460794119382985]
# _camera2gimbal第一位调yaw
# _camera2gimbal第二位调yaw
# _camera2gimbal第三位调pitch
#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
# 陀螺仪是否装错, 编号012分别代表电控坐标系ypr，想换旋转轴只需要对编号进行互换即可，负号就是对当前值取负，交换完再取负
# 上车前记得对齐电控坐标系和济瞄惯性系
gimbal_y1: 1
gimbal_p2: -3
gimbal_r3: -2
# 济瞄的惯性系  z轴往上, x轴是枪管指向
#     x  z
#      \ |
#       \|
# y_ _ _ 0   z:yaw   x:roll   y:pitch


#####-----planner-----#####
target_dist_error: -0.23
target_h_error: 0.28
fire_thresh: 0.0035
small_armor_tolerance: 0.12
big_armor_tolerance: 0.22
tower_and_base_armor_tolerance_: 0.10  # 26赛季前哨站和基地装甲板检测宽度
gimbal_control_delay: 0.08
tower_pitch_prediction_time: 0.05

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]
