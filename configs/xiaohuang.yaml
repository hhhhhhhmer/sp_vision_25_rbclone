R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, -1]

# 相机同理想情况的偏角: yaw-0.87 pitch-0.91 roll-1.00 degree
# 标定板到世界坐标系原点的水平距离: 3.02 m
# 标定板同竖直摆放时的偏角: yaw106.19 pitch9.00 roll-1.60 degree
R_camera2gimbal: [0.015518470321146605, -0.015643013374447828, 0.9997572071315407, -0.9997280102863566, -0.017651979339967417, 0.015241819913124462, 0.017409265572517454, -0.9997218131850222, -0.01591269035321636]
t_camera2gimbal: [0.18555554841512642, -0.016842994914804996, 0.030817235972619976]
# 重投影误差: 0.1056px
camera_matrix: [2441.827665989863, 0, 691.9455542050595, 0, 2425.7023748895353, 555.9135405662234, 0, 0, 1]
distort_coeffs: [-0.049512074262373466, 0.23344510569813, 0.0026741357009112737, -0.00155865327356647, -0.41449838928263805]
# _camera2gimbal第一位调yaw
# _camera2gimbal第二位调yaw
# _camera2gimbal第三位调pitch
#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
# 陀螺仪是否装错, 编号012分别代表电控坐标系ypr，想换旋转轴只需要对编号进行互换即可，负号就是对当前值取负，交换完再取负
# 上车前记得对齐电控坐标系和济瞄惯性系
gimbal_y1: 1
gimbal_p2: 2
gimbal_r3: 3
# 济瞄的惯性系  z轴往上, x轴是枪管指向
#     x  z
#      \ |
#       \|
# y_ _ _ 0   z:yaw   x:roll   y:pitch

#####-----planner-----#####
target_dist_error: -0.23
target_h_error: 0.28
fire_thresh: 0.003 # 
small_armor_tolerance: 0.12
big_armor_tolerance: 0.22
tower_and_base_armor_tolerance_: 0.10  # 26赛季前哨站和基地装甲板检测宽度
gimbal_control_delay: 0
tower_pitch_prediction_time: 0.05

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 40
  morphology_size:
    blue: 3
    red: 3
  dilate_size: 2
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 200
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 3000
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

model: "/home/cyn/Desktop/sp_vision_25_rbclone/yolo_buff/runs/pose/runs/rune_pose/yolo11n_rune/weights/best.onnx"
buff_confidence_threshold: 0.7
buff_keypoint_threshold: 0.3
buff_rune_radius_m: 0.700
buff_locked_gate_deg: 25
buff_switch_gate_deg: 10
buff_switch_confirm_frames: 3
buff_locked_lost_max: 6
#####-----buff_aimer参数-----#####
aim_time: 0.150         # s
wait_time: 0.300        # s
command_fire_gap: 0.080 # s
fire_gap_time: 0.700   # s
predict_time: 0.120    # s
