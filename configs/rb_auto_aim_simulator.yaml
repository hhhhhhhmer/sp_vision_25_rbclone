# ROS 2 simulator input and detection
enemy_color: "blue"
yolo_name: yolov8
classify_model: ../assets/tiny_resnet.onnx
yolo11_model_path: ../assets/yolo11.xml
yolov8_model_path: ../assets/yolov8.xml
yolov5_model_path: ../assets/yolov5.xml
trt_engine_path_0708: ../assets/0708_fp16_super.engine
trt_engine_path_0526: ../assets/0526.engine
device: CPU
detect_color: -1
min_confidence: 0.65


threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

roi:
  x: 0
  y: 0
  width: -1
  height: -1

use_roi: false
# Tracker
min_detect_count: 5
max_temp_lost_count: 20
outpost_max_temp_lost_count: 75


#####-----UV观测 / 多装甲融合（Tracker 使用；相机、标定、打符程序忽略）-----#####
uv_observation: true
uv_sigma_px: 1.0             # 灯条端点检测噪声 (px)
uv_sigma_len_ratio: 0.045    # 与灯条像素长度成比例的附加端点噪声（尺度不变项）
uv_sigma_attitude_deg: 0.5   # 云台/外参姿态误差 (deg)，等效像素加到灯条中心噪声
uv_attitude_common_ratio: 0.0 # 姿态误差中整帧共模的比例：0=各灯条独立，1=完全共模
uv_sigma_angle: 0.1          # 灯条角度噪声下限 (rad)
uv_associate_gate_px: 60.0   # 灯条中心像素距离关联门限
uv_facing_cos_min: 0.15      # 可见性判据（装甲板法线与视线夹角余弦下限）
uv_radius_prior_sigma: 0.02  # 单装甲退化保护：半径先验标准差 (m)
uv_process_noise_z_scale: 0.05 # 深度过程噪声缩放：Q_z = v1*scale（v1=100 → 5），闭环自瞄下优先平滑

# 窄窗 PnP 装甲朝向：UV 下 θ 只有"两条灯条间距"一路弱信息（正对时导数还是 0），
# 用 ±20° 窄窗 PnP 补一个 σ≈5° 的 1 维观测；纯 UV 对照时可关。
uv_pnp_yaw: true
uv_pnp_yaw_sigma_deg: 5.0
uv_pnp_yaw_window_deg: 20.0
uv_pnp_yaw_steps: 20

# PnP 回退/对照用；UV 模式下不生效
meas_azimuth_sigma: 0.01
meas_distance_sigma: 0.15
meas_angle_sigma: 0.10

# ---- 多装甲板融合 ----
multi_armor_fusion: true
# 融合第二块及之后装甲板时的马氏距离门限（4 自由度卡方，99.9% 约 18.5）
multi_armor_gate: 20.0
# 融合第二块及之后装甲板时，其 PnP 朝向的噪声放大系数（仅 PnP 路径生效）
multi_armor_angle_sigma_scale: 10.0

# Planner
yaw_offset: 0
pitch_offset: 0
far_pitch_offset: 0
decision_speed: 8
high_speed_delay_time: 0.030
low_speed_delay_time: 0.015
target_dist_error: 0
target_h_error: 0
fire_thresh: 0.003
small_armor_tolerance: 0.12
big_armor_tolerance: 0.22
tower_and_base_armor_tolerance_: 0.10
gimbal_control_delay: 0.08
tower_pitch_prediction_time: 0.05
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

# Daedalus defaults: 1440x1080, vertical FOV 45 degrees, no distortion.
camera_matrix: [1303.675324, 0, 720, 0, 1303.675324, 540, 0, 0, 1]
distort_coeffs: [0, 0, 0, 0, 0]

# ROS gimbal_link uses x-forward/y-left/z-up; camera optical uses
# x-right/y-down/z-forward. The /tf quaternion already is gimbal-to-odom.
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0, 0, 0]
