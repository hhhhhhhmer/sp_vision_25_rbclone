yolov8_model_path: ../assets/yolov8.xml
yolov5_model_path: ../assets/yolov5.xml
ov_0526_model_path: ../assets/yolov5_0526.xml
device: CPU
min_confidence: 0.5
yolo_score_threshold: 0.65
yolo_nms_threshold: 0.45
use_traditional: true

#####-----ROI-----#####
