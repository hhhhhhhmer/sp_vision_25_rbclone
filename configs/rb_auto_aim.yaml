R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.0901px
camera_matrix: [1813.554114428731, 0, 712.274797427587, 0, 1813.369040609312, 526.9183416131992, 0, 0, 1]
