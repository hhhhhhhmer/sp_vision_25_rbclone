R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]


# 相机同理想情况的偏角: yaw-3.11 pitch-0.68 roll0.21 degree
# 标定板到世界坐标系原点的水平距离: 3.71 m
# 标定板同竖直摆放时的偏角: yaw-60.81 pitch5.77 roll178.92 degree
R_camera2gimbal: [0.054173795801965755, -0.012022496889007464, 0.9984591425876975, -0.9985244799230355, 0.0031030309223427574, 0.054214704587644574, -0.0037500457113888983, -0.999922912412576, -0.01183665448991832]
t_camera2gimbal: [0.2616737948916601, -0.07153032005460355, 0.004140131101408284]

# 重投影误差: 0.0600px
camera_matrix: [3629.2604024723614, 0, 615.76296028559454, 0, 3617.5424611963276, 537.28249377915051, 0, 0, 1]
distort_coeffs: [-0.0064563365740047977, 0.26597520888340187, -0.00091608724392189006, -0.0084950810347407466, -0.87748546654082848]

com_port: "/dev/ttyUSB0"
# 陀螺仪是否装错, 编号012分别代表电控坐标系ypr，想换旋转轴只需要对编号进行互换即可，负号就是对当前值取负，交换完再取负
# 上车前记得对齐电控坐标系和济瞄惯性系
gimbal_y1: 1
gimbal_p2: 2
gimbal_r3: 3
# 济瞄的惯性系  z轴往上, x轴是枪管指向
#     x  z
#      \ |
#       \|
# y_ _ _ 0   z:yaw   x:roll   y:pitch

#####-----UV观测 / 多装甲融合（Tracker 使用；相机、标定、打符程序忽略）-----#####
uv_observation: true
uv_sigma_px: 1.0             # 灯条端点检测噪声 (px)
uv_sigma_len_ratio: 0.045    # 与灯条像素长度成比例的附加端点噪声（尺度不变项）
uv_sigma_attitude_deg: 0.5   # 云台/外参姿态误差 (deg)，等效像素加到灯条中心噪声
uv_attitude_common_ratio: 0.0 # 姿态误差中整帧共模的比例：0=各灯条独立，1=完全共模
uv_sigma_angle: 0.1          # 灯条角度噪声下限 (rad)
uv_associate_gate_px: 60.0   # 灯条中心像素距离关联门限
uv_facing_cos_min: 0.15      # 可见性判据（装甲板法线与视线夹角余弦下限）
uv_radius_prior_sigma: 0.02  # 单装甲退化保护：半径先验标准差 (m)
uv_process_noise_z_scale: 0.05 # 深度过程噪声缩放：Q_z = v1*scale（v1=100 → 5），闭环自瞄下优先平滑
multi_armor_fusion: true
