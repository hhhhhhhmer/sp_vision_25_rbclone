yolov8_model_path: ../assets/yolov8.xml
yolov5_model_path: ../assets/yolov5.xml
device: GPU
min_confidence: 0.7
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 1280
image_height: 720

fov_h: 61.9 #87.7
fov_v: 77.3 


new_fov_h: 63.133 #67
new_fov_v: 65.0484
usb_frame_rate: 120
usb_exposure: 500 #1-80000______250
usb_gamma: 160
usb_gain: 10 #0-96

#####-----decider参数-----#####
mode: 1

#####-----工业相机参数-----#####
# camera_name: "hikrobot"
# exposure_us: 2000
# gain: 16.9
# vid_pid: "2bdf:0001"
# flip: false
# mirror: false
# timestamp_offset_us: 1000 #us

camera_name: "daheng"
camera_sn: "KE0210010004"
exposure_us: 2000
gain: 1
gamma: 0.5  
img_gamma: 0.25
vid_pid: "2ba2:4d55"
flip: true
mirror: true
timestamp_offset_us: 1000 #us


# #####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"



#####-----gimbal参数-----#####
com_port: "/dev/ttyACM1"
# 陀螺仪是否装错, 编号012分别代表电控坐标系ypr，想换旋转轴只需要对编号进行互换即可，负号就是对当前值取负，交换完再取负
# 上车前记得对齐电控坐标系和济瞄惯性系
gimbal_y1: 1
gimbal_p2: 2
gimbal_r3: -3
# 济瞄的惯性系  z轴往上, x轴是枪管指向
#     x  z
#      \ |
#       \|
# y_ _ _ 0   z:yaw   x:roll   y:pitch


#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75


#####-----UV观测 / 多装甲融合（Tracker 使用；相机、标定、打符程序忽略）-----#####
uv_observation: true
uv_sigma_px: 1.0             # 灯条端点检测噪声 (px)
uv_sigma_len_ratio: 0.045    # 与灯条像素长度成比例的附加端点噪声（尺度不变项）
uv_sigma_attitude_deg: 0.5   # 云台/外参姿态误差 (deg)，等效像素加到灯条中心噪声
uv_attitude_common_ratio: 0.0 # 姿态误差中整帧共模的比例：0=各灯条独立，1=完全共模
uv_sigma_angle: 0.1          # 灯条角度噪声下限 (rad)
uv_associate_gate_px: 60.0   # 灯条中心像素距离关联门限
uv_facing_cos_min: 0.15      # 可见性判据（装甲板法线与视线夹角余弦下限）
uv_radius_prior_sigma: 0.02  # 单装甲退化保护：半径先验标准差 (m)
uv_process_noise_z_scale: 0.05 # 深度过程噪声缩放：Q_z = v1*scale（v1=100 → 5），闭环自瞄下优先平滑

# 窄窗 PnP 装甲朝向：UV 下 θ 只有"两条灯条间距"一路弱信息（正对时导数还是 0），
# 用 ±20° 窄窗 PnP 补一个 σ≈5° 的 1 维观测；纯 UV 对照时可关。
uv_pnp_yaw: true
uv_pnp_yaw_sigma_deg: 5.0
uv_pnp_yaw_window_deg: 20.0
uv_pnp_yaw_steps: 20

# PnP 回退/对照用；UV 模式下不生效
meas_azimuth_sigma: 0.01
meas_distance_sigma: 0.15
meas_angle_sigma: 0.10

# ---- 多装甲板融合 ----
multi_armor_fusion: true
# 融合第二块及之后装甲板时的马氏距离门限（4 自由度卡方，99.9% 约 18.5）
multi_armor_gate: 20.0
# 融合第二块及之后装甲板时，其 PnP 朝向的噪声放大系数（仅 PnP 路径生效）
multi_armor_angle_sigma_scale: 10.0

#####-----aimer参数-----#####
yaw_offset: -0.8 # degree -2.5
pitch_offset: -1  # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
left_yaw_offset: -1
right_yaw_offset: -0.6
decision_speed: 10 # rad/s
high_speed_delay_time: 0.026 # s
low_speed_delay_time: 0.010 # s

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----planner-----#####
target_dist_error: -0.23
target_h_error: 0.28
fire_thresh: 0.0035
small_armor_tolerance: 0.12
big_armor_tolerance: 0.22
tower_and_base_armor_tolerance_: 0.10  # 26赛季前哨站和基地装甲板检测宽度
gimbal_control_delay: 0.08
tower_pitch_prediction_time: 0.05

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]


