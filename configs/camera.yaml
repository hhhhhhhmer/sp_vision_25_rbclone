#####-----UV观测 / 多装甲融合（Tracker 使用；相机、标定、打符程序忽略）-----#####
uv_observation: true
uv_sigma_px: 1.0             # 灯条端点检测噪声 (px)
uv_sigma_len_ratio: 0.045    # 与灯条像素长度成比例的附加端点噪声（尺度不变项）
uv_sigma_attitude_deg: 0.5   # 云台/外参姿态误差 (deg)，等效像素加到灯条中心噪声
uv_attitude_common_ratio: 0.0 # 姿态误差中整帧共模的比例：0=各灯条独立，1=完全共模
uv_sigma_angle: 0.1          # 灯条角度噪声下限 (rad)
uv_associate_gate_px: 60.0   # 灯条中心像素距离关联门限
uv_facing_cos_min: 0.15      # 可见性判据（装甲板法线与视线夹角余弦下限）
uv_radius_prior_sigma: 0.02  # 单装甲退化保护：半径先验标准差 (m)
uv_process_noise_z_scale: 0.05 # 深度过程噪声缩放：Q_z = v1*scale（v1=100 → 5），闭环自瞄下优先平滑

# 窄窗 PnP 装甲朝向：UV 下 θ 只有"两条灯条间距"一路弱信息（正对时导数还是 0），
# 用 ±20° 窄窗 PnP 补一个 σ≈5° 的 1 维观测；纯 UV 对照时可关。
uv_pnp_yaw: true
uv_pnp_yaw_sigma_deg: 5.0
uv_pnp_yaw_window_deg: 20.0
uv_pnp_yaw_steps: 20

# PnP 回退/对照用；UV 模式下不生效
meas_azimuth_sigma: 0.01
meas_distance_sigma: 0.15
meas_angle_sigma: 0.10

# ---- 多装甲板融合 ----
multi_armor_fusion: true
# 融合第二块及之后装甲板时的马氏距离门限（4 自由度卡方，99.9% 约 18.5）
multi_armor_gate: 20.0
# 融合第二块及之后装甲板时，其 PnP 朝向的噪声放大系数（仅 PnP 路径生效）
multi_armor_angle_sigma_scale: 10.0
